name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: js-package-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  KITTENTTS_CACHE_DIR: ${{ github.workspace }}/.context/asset-cache

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache pinned nano assets
        uses: actions/cache@v5
        with:
          path: .context/asset-cache
          key: nano-assets-${{ runner.os }}-${{ hashFiles('scripts/bootstrap_reference_fixtures.ts', 'fixtures/reference-manifest.json', 'src/sdk/model-registry.ts') }}

      - name: Verify package quality and unit behavior
        run: >-
          pnpm exec vitest run
          tests-js/core.test.ts
          tests-js/native-smoke-artifacts.test.ts
          tests-js/package-quality.test.ts
          tests-js/react-native.test.ts
          tests-js/text-parity.test.ts
          tests-js/text-robustness.test.ts

  python-reference:
    name: Python reference oracle
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify retained normalization oracle
        env:
          PYTHONPATH: reference/python
        run: python -m unittest discover reference/python/tests

  parity:
    name: Node and Python parity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache pinned nano assets
        uses: actions/cache@v5
        with:
          path: .context/asset-cache
          key: nano-assets-${{ runner.os }}-${{ hashFiles('scripts/bootstrap_reference_fixtures.ts', 'fixtures/reference-manifest.json', 'src/sdk/model-registry.ts') }}

      - name: Cache model matrix assets
        uses: actions/cache@v5
        with:
          path: .context/model-matrix-cache
          key: model-matrix-${{ runner.os }}-${{ hashFiles('fixtures/model-parity.json', 'src/sdk/model-registry.ts') }}

      - name: Verify Node and Python parity
        env:
          KITTENTTS_LISTENING_DIR: .context/listening-samples
        run: pnpm exec vitest run tests-js/parity.integration.test.ts

      - name: Upload listening samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nano-listening-samples
          path: .context/listening-samples/*.wav
          if-no-files-found: warn

  browser-packed:
    name: Packed browser / ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case:
          - main-auto
          - main-wasm
          - worker-wasm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache pinned nano assets
        uses: actions/cache@v5
        with:
          path: .context/asset-cache
          key: nano-assets-${{ runner.os }}-${{ hashFiles('scripts/bootstrap_reference_fixtures.ts', 'fixtures/reference-manifest.json', 'src/sdk/model-registry.ts') }}

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true

      - name: Verify packed browser consumer
        env:
          BROWSER_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          KITTENTTS_BROWSER_CONSUMER_CASE: ${{ matrix.case }}
        run: pnpm exec vitest run tests-js/browser.integration.test.ts -t "packed browser consumers"

  browser-wasm:
    name: Chrome WASM and model matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache pinned nano assets
        uses: actions/cache@v5
        with:
          path: .context/asset-cache
          key: nano-assets-${{ runner.os }}-${{ hashFiles('scripts/bootstrap_reference_fixtures.ts', 'fixtures/reference-manifest.json', 'src/sdk/model-registry.ts') }}

      - name: Cache model matrix assets
        uses: actions/cache@v5
        with:
          path: .context/model-matrix-cache
          key: model-matrix-${{ runner.os }}-${{ hashFiles('fixtures/model-parity.json', 'src/sdk/model-registry.ts') }}

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true

      - name: Verify Chrome WASM and model matrix
        env:
          BROWSER_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: pnpm exec vitest run tests-js/browser.integration.test.ts -t "browser example loads|all registered browser models"

  browser-webgpu:
    name: Chrome WebGPU
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache pinned nano assets
        uses: actions/cache@v5
        with:
          path: .context/asset-cache
          key: nano-assets-${{ runner.os }}-${{ hashFiles('scripts/bootstrap_reference_fixtures.ts', 'fixtures/reference-manifest.json', 'src/sdk/model-registry.ts') }}

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true

      - name: Verify Chrome WebGPU
        env:
          BROWSER_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: pnpm exec vitest run tests-js/browser.integration.test.ts -t "explicit WebGPU"

  browser-firefox:
    name: Firefox WASM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache pinned nano assets
        uses: actions/cache@v5
        with:
          path: .context/asset-cache
          key: nano-assets-${{ runner.os }}-${{ hashFiles('scripts/bootstrap_reference_fixtures.ts', 'fixtures/reference-manifest.json', 'src/sdk/model-registry.ts') }}

      - name: Setup Firefox
        id: setup-firefox
        uses: browser-actions/setup-firefox@v1

      - name: Verify Firefox WASM
        env:
          FIREFOX_BIN: ${{ steps.setup-firefox.outputs.firefox-path }}
          KITTENTTS_FIREFOX: "1"
        run: pnpm exec vitest run tests-js/firefox.integration.test.ts

  browser-safari:
    name: Safari WASM
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache pinned nano assets
        uses: actions/cache@v5
        with:
          path: .context/asset-cache
          key: nano-assets-${{ runner.os }}-${{ hashFiles('scripts/bootstrap_reference_fixtures.ts', 'fixtures/reference-manifest.json', 'src/sdk/model-registry.ts') }}

      - name: Enable Safari Remote Automation
        run: sudo safaridriver --enable

      - name: Verify Safari WASM
        env:
          KITTENTTS_SAFARI: "1"
        run: pnpm exec vitest run tests-js/safari.integration.test.ts

  node-compatibility:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache pinned nano assets
        uses: actions/cache@v5
        with:
          path: .context/asset-cache
          key: nano-assets-${{ runner.os }}-${{ hashFiles('scripts/bootstrap_reference_fixtures.ts', 'fixtures/reference-manifest.json', 'src/sdk/model-registry.ts') }}

      - name: Verify packed Node consumer
        run: pnpm exec vitest run tests-js/package-node.integration.test.ts
