name: React Native Device Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/react-native.yml"
      - ".maestro/**"
      - "docs/react-native.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/bootstrap_react_native_smoke_assets.ts"
      - "scripts/install_maestro.sh"
      - "scripts/prepare_react_native_smoke.mjs"
      - "scripts/serve_react_native_smoke_assets.mjs"
      - "scripts/verify_react_native_smoke_artifacts.ts"
      - "src/**"
      - "tests-native/**"
      - "tsdown.config.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/react-native.yml"
      - ".maestro/**"
      - "docs/react-native.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/bootstrap_react_native_smoke_assets.ts"
      - "scripts/install_maestro.sh"
      - "scripts/prepare_react_native_smoke.mjs"
      - "scripts/serve_react_native_smoke_assets.mjs"
      - "scripts/verify_react_native_smoke_artifacts.ts"
      - "src/**"
      - "tests-native/**"
      - "tsdown.config.ts"

permissions:
  contents: read

concurrency:
  group: react-native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  KITTENTTS_CACHE_DIR: ${{ github.workspace }}/.context/asset-cache
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
  MAESTRO_CLI_NO_ANALYTICS: "1"
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"

jobs:
  ios:
    name: iOS simulator / Release / Hermes
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tests-native/react-native-smoke/pnpm-lock.yaml

      - name: Setup Java for Maestro
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "2.6.9"
          bundler-cache: true
          working-directory: tests-native/react-native-smoke

      - name: Install package dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache native smoke assets
        uses: actions/cache@v5
        with:
          path: |
            .context/asset-cache
            .context/native-smoke-assets
          key: native-smoke-assets-${{ hashFiles('src/sdk/model-registry.ts', 'src/react-native/phonemizer.ts', 'scripts/bootstrap_react_native_smoke_assets.ts') }}

      - name: Cache Maestro
        uses: actions/cache@v5
        with:
          path: .context/maestro
          key: maestro-2.7.0-${{ runner.os }}

      - name: Prepare packed consumer and pinned assets
        run: |
          pnpm native:smoke:prepare
          pnpm native:smoke:assets
          echo "$(scripts/install_maestro.sh)" >> "$GITHUB_PATH"

      - name: Verify fixture type, lint, and component tests
        working-directory: tests-native/react-native-smoke
        run: |
          pnpm exec tsc --noEmit
          pnpm lint
          pnpm test --runInBand

      - name: Install CocoaPods dependencies
        working-directory: tests-native/react-native-smoke/ios
        run: bundle exec pod install

      - name: Build Release app for the simulator
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for values in d["devices"].values() for x in values if x["name"].startswith("iPhone")))')"
          echo "KITTENTTS_IOS_DEVICE_ID=${device_id}" >> "$GITHUB_ENV"
          xcrun simctl boot "${device_id}" || true
          xcrun simctl bootstatus "${device_id}" -b
          xcodebuild \
            -workspace tests-native/react-native-smoke/ios/KittenTtsNativeSmoke.xcworkspace \
            -scheme KittenTtsNativeSmoke \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${device_id}" \
            -derivedDataPath .context/native-ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Run native synthesis smoke test
        run: |
          mkdir -p .context/native-artifacts/ios
          pnpm native:smoke:serve > .context/native-artifacts/ios/asset-server.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9123/manifest.json >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9123/manifest.json >/dev/null
          app=.context/native-ios-derived/Build/Products/Release-iphonesimulator/KittenTtsNativeSmoke.app
          xcrun simctl install "${KITTENTTS_IOS_DEVICE_ID}" "${app}"
          set +e
          maestro test --udid "${KITTENTTS_IOS_DEVICE_ID}" .maestro/native-smoke.yaml 2>&1 | tee .context/native-artifacts/ios/maestro.log
          smoke_status=${PIPESTATUS[0]}
          set -e
          data_container="$(xcrun simctl get_app_container "${KITTENTTS_IOS_DEVICE_ID}" com.kittentts.smoke data 2>/dev/null || true)"
          if [[ -n "${data_container}" ]]; then
            cp "${data_container}/Documents/native-smoke-result.json" .context/native-artifacts/ios/ 2>/dev/null || true
            cp "${data_container}/Documents/native-smoke.wav" .context/native-artifacts/ios/ 2>/dev/null || true
          fi
          xcrun simctl io "${KITTENTTS_IOS_DEVICE_ID}" screenshot .context/native-artifacts/ios/final.png || true
          xcrun simctl spawn "${KITTENTTS_IOS_DEVICE_ID}" log show --last 15m --style compact \
            --predicate 'process == "KittenTtsNativeSmoke"' > .context/native-artifacts/ios/device.log 2>&1 || true
          if [[ "${smoke_status}" -ne 0 ]]; then
            exit "${smoke_status}"
          fi
          pnpm exec tsx scripts/verify_react_native_smoke_artifacts.ts \
            ios \
            .context/native-artifacts/ios/native-smoke-result.json \
            .context/native-artifacts/ios/native-smoke.wav

      - name: Upload iOS evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: react-native-ios-smoke
          path: .context/native-artifacts/ios
          if-no-files-found: warn

  android:
    name: Android emulator / Release / Hermes
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tests-native/react-native-smoke/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install package dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache native smoke assets
        uses: actions/cache@v5
        with:
          path: |
            .context/asset-cache
            .context/native-smoke-assets
          key: native-smoke-assets-${{ hashFiles('src/sdk/model-registry.ts', 'src/react-native/phonemizer.ts', 'scripts/bootstrap_react_native_smoke_assets.ts') }}

      - name: Cache Maestro
        uses: actions/cache@v5
        with:
          path: .context/maestro
          key: maestro-2.7.0-${{ runner.os }}

      - name: Prepare packed consumer and pinned assets
        run: |
          pnpm native:smoke:prepare
          pnpm native:smoke:assets
          echo "$(scripts/install_maestro.sh)" >> "$GITHUB_PATH"

      - name: Install Android build SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Build Release APK
        working-directory: tests-native/react-native-smoke/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Run native synthesis smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p .context/native-artifacts/android
            pnpm native:smoke:serve > .context/native-artifacts/android/asset-server.log 2>&1 &
            server_pid=$!
            trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
            for attempt in {1..30}; do
              if curl --fail --silent http://127.0.0.1:9123/manifest.json >/dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:9123/manifest.json >/dev/null
            adb install -r tests-native/react-native-smoke/android/app/build/outputs/apk/release/app-release.apk
            adb shell run-as com.kittentts.smoke true
            set +e
            maestro test .maestro/native-smoke.yaml 2>&1 | tee .context/native-artifacts/android/maestro.log
            smoke_status=${PIPESTATUS[0]}
            set -e
            adb exec-out run-as com.kittentts.smoke cat files/native-smoke-result.json \
              > .context/native-artifacts/android/native-smoke-result.json 2>/dev/null || true
            adb exec-out run-as com.kittentts.smoke cat files/native-smoke.wav \
              > .context/native-artifacts/android/native-smoke.wav 2>/dev/null || true
            adb exec-out screencap -p > .context/native-artifacts/android/final.png || true
            adb logcat -d > .context/native-artifacts/android/device.log || true
            if [[ "${smoke_status}" -ne 0 ]]; then
              exit "${smoke_status}"
            fi
            pnpm exec tsx scripts/verify_react_native_smoke_artifacts.ts \
              android \
              .context/native-artifacts/android/native-smoke-result.json \
              .context/native-artifacts/android/native-smoke.wav

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: react-native-android-smoke
          path: .context/native-artifacts/android
          if-no-files-found: warn
